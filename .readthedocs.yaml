# Read the Docs configuration for Simulacrax.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The docs dependencies live in a PEP 735 dependency-group ([dependency-groups]
# docs), and mkdocstrings imports the package to render the API reference, so the
# build installs the project and its docs group from the lockfile with uv rather
# than using Read the Docs' native mkdocs/pip integration.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install uv
    - uv sync --frozen --group docs
    - uv run mkdocs build --strict --site-dir "$READTHEDOCS_OUTPUT/html"
