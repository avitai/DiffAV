name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # weekly on Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "security"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run dependency audit
        # Audit every locked group and extra; a bare uvx pip-audit audits only its own tool env.
        run: |
          uv export --frozen --all-extras --all-groups --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps

      - name: Run Bandit security linter
        run: uv run bandit -r src/ -ll
