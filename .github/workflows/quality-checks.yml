name: Code Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  already_tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      # A merge repeats the pull request; a schedule or a manual run re-measures on purpose. When
      # this step does not run the output is empty, which every consumer reads as "test it". The
      # compare lives in substrax: skip only when this tree is the pull request's and every check
      # of it succeeded.
      - name: Compare this tree with the pull request that produced it
        id: compare
        if: github.event_name == 'push'
        uses: avitai/substrax/.github/actions/already-tested@ec43d80bbae0040375f746cd1bb07dddb0a0b169

  quality-checks:
    runs-on: ubuntu-latest
    needs: [already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "quality"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

      - name: Run type checking with pyright
        run: uv run pyright src/

      - name: Type safety summary
        if: always()
        run: |
          echo "## Type Safety Report" >> $GITHUB_STEP_SUMMARY
          echo "### Pyright Analysis" >> $GITHUB_STEP_SUMMARY
          uv run pyright --outputjson src/ | jq -r '.summary | "- Errors: \(.errorCount)\n- Warnings: \(.warningCount)\n- Information: \(.informationCount)"' >> $GITHUB_STEP_SUMMARY || true
