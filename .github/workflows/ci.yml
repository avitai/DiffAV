name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  already_tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      # A merge repeats the pull request; a schedule or a manual run re-measures on purpose. When
      # this step does not run the output is empty, which every consumer reads as "test it". The
      # compare lives in substrax: skip only when this tree is the pull request's and every check
      # of it succeeded.
      - name: Compare this tree with the pull request that produced it
        id: compare
        if: github.event_name == 'push'
        uses: avitai/substrax/.github/actions/already-tested@ec43d80bbae0040375f746cd1bb07dddb0a0b169

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "lint"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff linter
        run: uv run ruff check --output-format=github

      - name: Run Ruff formatter check
        run: uv run ruff format --check

  test-fast:
    name: Fast Tests
    needs: [lint, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Fast PR gate: the slow tier (heavy sampling/training suites) runs in
    # tests-extended.yml on schedule and on pushes to main.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "test-fast"

      - name: Install dependencies
        run: uv sync --locked


      - name: Run fast test tier
        env:
          JAX_PLATFORMS: cpu
        # Coverage is informational here — the fast tier deliberately skips the
        # slow suites, so the real >=94% gate runs on the full suite in
        # tests-extended.yml.
        run: |
          uv run pytest -m "not slow" \
            --cov=src --cov-report=term-missing --cov-fail-under=0

  build:
    name: Build Package
    needs: [lint, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "build"

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/
