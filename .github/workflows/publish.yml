# Publish to PyPI when a GitHub Release is published; run a manual TestPyPI dry
# run via workflow_dispatch (target: testpypi). Authentication uses PyPI API
# tokens stored as environment-scoped secrets (matching the sister repos):
#   - environment `pypi`     -> secret PYPI_API_TOKEN
#   - environment `testpypi` -> secret TEST_PYPI_API_TOKEN

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Target index for a manual publish"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "publish"

      - name: Build package
        run: uv build

      - name: Verify package metadata
        run: uvx twine check dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'

    environment:
      name: testpypi
      url: https://test.pypi.org/project/diffav/

    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')

    environment:
      name: pypi
      url: https://pypi.org/project/diffav/

    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
