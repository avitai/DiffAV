name: Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Clean-Import
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "build-verification"

      - name: Build package
        run: uv build

      - name: Verify package metadata
        run: uvx twine check dist/*

      - name: Test clean-environment import
        run: |
          uv venv test_venv --seed
          VIRTUAL_ENV=test_venv uv pip install dist/*.whl
          test_venv/bin/python -c "import simulacrax; print('simulacrax imported OK')"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-dist-verified
          path: dist/
